# Reproduces the verified PangeaFeeHookV2M bytecode exactly. remappings.txt is the full list the deployed build
# used: the remappings are part of the metadata hash (and so of the bytecode), so keep all of them.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"
auto_detect_remappings = false
